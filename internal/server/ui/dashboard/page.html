<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Claude Code Proxy 控制台</title>
  <style>
    :root{color-scheme:light dark;--bg:#0f172a;--panel:#111827;--muted:#94a3b8;--text:#e5eefb;--line:#243247;--accent:#60a5fa;--soft:#172033}
    *{box-sizing:border-box}body{margin:0;font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;background:linear-gradient(180deg,#0b1220,#111827);color:var(--text)}
    main{max-width:1200px;margin:auto;padding:24px}.hero,.panel{background:rgba(17,24,39,.92);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 18px 40px rgba(0,0,0,.18)}
    h1,h2{margin:0 0 10px}.muted{color:var(--muted)}.hero{margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
    .card{display:block;text-decoration:none;color:inherit;background:var(--soft);border:1px solid var(--line);border-radius:16px;padding:16px;min-height:122px}
    .card:hover{border-color:var(--accent);transform:translateY(-1px)}.card strong{display:block;font-size:1.05rem;margin-bottom:8px}
    pre{margin:0;white-space:pre-wrap;overflow:auto;background:#0b1220;border-radius:12px;padding:14px;border:1px solid var(--line)}
  </style>
</head>
<body>
  <main>
    <section class="hero">
      <h1>__DASHBOARD_TITLE__</h1>
      <p class="muted">__DASHBOARD_STATUS__</p>
      <script>window.__localPageToken=window.__localPageToken||'';</script>
    </section>
    <section class="panel" style="margin-bottom:18px">
      <h2>功能入口</h2>
      <div class="grid">__DASHBOARD_CARDS__</div>
    </section>
    <section class="panel">
      <h2>当前状态</h2>
      <pre id="statusJson">__DASHBOARD_JSON__</pre>
    </section>
  </main>
</body>
</html>
