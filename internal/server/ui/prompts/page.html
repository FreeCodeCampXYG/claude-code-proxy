<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Prompt 存档</title>
  <style>
    :root{color-scheme:light dark;--bg:#f7f8fb;--surface:#fff;--surface-2:#eef2f7;--border:#d8dee9;--text:#172033;--muted:#5b667a;--accent:#4263eb;--shadow:0 12px 32px rgba(15,23,42,.08)}@media(prefers-color-scheme:dark){:root{--bg:#0f1420;--surface:#171e2e;--surface-2:#202a3d;--border:#344055;--text:#f1f4f9;--muted:#a8b3c7;--accent:#7c9cff;--shadow:0 12px 32px rgba(0,0,0,.28)}}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}main{max-width:1200px;margin:auto;padding:24px}.panel{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:18px;margin-bottom:16px;box-shadow:var(--shadow)}.toolbar{display:flex;gap:10px;flex-wrap:wrap}.field{display:grid;gap:6px}input,select,button{font:inherit;border:1px solid var(--border);border-radius:10px;background:var(--surface-2);color:var(--text);padding:9px}.primary{background:var(--accent);border-color:var(--accent);color:white}.muted{color:var(--muted)}table{width:100%;border-collapse:collapse}th,td{border-bottom:1px solid var(--border);padding:10px;text-align:left}pre{white-space:pre-wrap;background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:12px}
  </style>
</head>
<body>
<main>
  <section class="panel">
    <h1>Prompt 存档</h1>
    <p class="muted">默认关闭，开启 PROMPT_ARCHIVE_ENABLED 后保存经过代理的 Claude 请求摘要与脱敏详情。</p>
    <script>window.__localPageToken=window.__localPageToken||'';</script>
  </section>
  <section class="panel toolbar">
    <label class="field">关键词<input placeholder="搜索首条用户消息 / 模型 / request id"></label>
    <label class="field">模型<select><option>全部模型</option></select></label>
    <label class="field">时间<select><option>最近 24 小时</option><option>最近 7 天</option></select></label>
    <button class="primary">搜索</button><button>导出 JSON</button><button>导出 Markdown</button>
  </section>
  <section class="panel">
    <h2>存档列表</h2>
    <table><thead><tr><th>时间</th><th>模型</th><th>消息数</th><th>摘要</th><th>状态</th></tr></thead><tbody id="rows"><tr><td colspan="5" class="muted">存储接口正在接入；当前仅提供页面与安全路由骨架。</td></tr></tbody></table>
  </section>
  <section class="panel">
    <h2>详情预览</h2>
    <pre id="status">__PROMPTS_BOOTSTRAP__</pre>
  </section>
</main>
</body>
</html>
