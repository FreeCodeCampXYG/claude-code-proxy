name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows-smoke:
    name: Windows test and build smoke
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'

    - name: Validate module metadata
      run: |
        go mod tidy
        git diff --exit-code -- go.mod go.sum

    - name: Run tests
      run: go test ./...

    - name: Generate Windows icon resource
      shell: pwsh
      run: |
        go run github.com/akavel/rsrc@v0.10.2 -arch amd64 -ico assets/windows/claude-code-proxy.ico -o cmd/claude-code-proxy/rsrc_windows_amd64.syso

    - name: Build Windows binary
      run: go build -ldflags "-X github.com/claude-code-proxy/proxy/internal/server.ProxyVersion=${{ github.ref_name }}" -o claude-code-proxy.exe ./cmd/claude-code-proxy

    - name: Verify Windows executable icon
      shell: pwsh
      run: ./scripts/verify-windows-icon.ps1 ./claude-code-proxy.exe

    - name: Smoke test Windows runtime diagnostics
      shell: pwsh
      run: |
        $mockPort = 18083
        $mock = Start-Job -ArgumentList $mockPort -ScriptBlock {
          param($port)
          $listener = [System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Loopback, $port)
          try {
            $listener.Start()
            Write-Output "MOCK_READY"
            $client = $listener.AcceptTcpClient()
            try {
              $stream = $client.GetStream()
              $reader = [System.IO.StreamReader]::new($stream, [System.Text.Encoding]::ASCII, $false, 1024, $true)
              while (($line = $reader.ReadLine()) -ne $null -and $line -ne '') {}
              $body = @'
        data: {"choices":[{"delta":{"reasoning_content":"thinking"},"finish_reason":null}]}

        data: {"choices":[{"delta":{},"finish_reason":"stop"}],"usage":{"prompt_tokens":3,"completion_tokens":2}}

        data: [DONE]

        '@
              $bodyBytes = [System.Text.Encoding]::UTF8.GetBytes($body)
              $headers = "HTTP/1.1 200 OK`r`nContent-Type: text/event-stream`r`nContent-Length: $($bodyBytes.Length)`r`nConnection: close`r`n`r`n"
              $headerBytes = [System.Text.Encoding]::ASCII.GetBytes($headers)
              $stream.Write($headerBytes, 0, $headerBytes.Length)
              $stream.Write($bodyBytes, 0, $bodyBytes.Length)
              $stream.Flush()
            } finally {
              $client.Dispose()
            }
          } finally {
            $listener.Stop()
          }
        }

        $mockReady = $false
        for ($attempt = 0; $attempt -lt 50; $attempt++) {
          if ((Receive-Job -Job $mock -Keep) -contains 'MOCK_READY') {
            $mockReady = $true
            break
          }
          if ($mock.State -in @('Completed', 'Failed', 'Stopped')) { break }
          Start-Sleep -Milliseconds 100
        }
        if (-not $mockReady) { throw "mock upstream did not start: $($mock.State)" }

        $env:OPENAI_BASE_URL = "http://127.0.0.1:$mockPort/v1"
        $env:OPENAI_PROVIDER = "newapi"
        $env:PORT = "18082"
        $env:DIAGNOSTICS_DB_PATH = Join-Path $env:RUNNER_TEMP "claude-code-proxy-diagnostics.db"
        $process = Start-Process -FilePath "$PWD/claude-code-proxy.exe" -ArgumentList "-d" -PassThru
        try {
          $health = $null
          for ($attempt = 0; $attempt -lt 30; $attempt++) {
            try {
              $health = Invoke-RestMethod "http://127.0.0.1:18082/health" -TimeoutSec 1
              break
            } catch {
              Start-Sleep -Milliseconds 500
            }
          }
          if ($null -eq $health) { throw "proxy health endpoint did not become ready" }
          if ($health.diagnostics_enabled -ne $true) { throw "diagnostics were not enabled: $($health | ConvertTo-Json -Compress)" }

          $request = @{
            model = "claude-sonnet-4"
            max_tokens = 64
            stream = $true
            messages = @(@{ role = "user"; content = "smoke" })
          } | ConvertTo-Json -Depth 5
          $response = Invoke-WebRequest "http://127.0.0.1:18082/v1/messages" -Method Post -ContentType "application/json" -Body $request -UseBasicParsing -TimeoutSec 15
          if ($response.StatusCode -ne 200) { throw "streaming request returned $($response.StatusCode)" }

          $events = @($response.Content -split "`r?`n" | Where-Object { $_ -like 'data: *' } | ForEach-Object {
            ($_ -replace '^data:\s*', '') | ConvertFrom-Json
          })
          $thinkingDeltas = @($events | Where-Object { $_.delta.type -eq 'thinking_delta' })
          if ($thinkingDeltas.Count -lt 1 -or $thinkingDeltas[0].delta.thinking -ne 'thinking') {
            throw "stream did not contain the expected thinking_delta: $($response.Content)"
          }
          if ($thinkingDeltas | Where-Object { $null -ne $_.delta.PSObject.Properties['text'] }) {
            throw "thinking_delta contained invalid delta.text: $($response.Content)"
          }
          if (-not ($events | Where-Object { $_.type -eq 'message_stop' })) {
            throw "stream did not contain message_stop: $($response.Content)"
          }

          $dashboard = Invoke-WebRequest "http://127.0.0.1:18082/debug/logs" -UseBasicParsing -TimeoutSec 5
          $tokenMatch = [regex]::Match($dashboard.Content, 'window\.__diagnosticsToken="([^"]+)"')
          if (-not $tokenMatch.Success) { throw "diagnostics dashboard did not provide a capability token" }
          $diagnosticsHeaders = @{ "X-Diagnostics-Token" = $tokenMatch.Groups[1].Value }
          $analytics = Invoke-RestMethod "http://127.0.0.1:18082/debug/logs/analytics" -Headers $diagnosticsHeaders -TimeoutSec 5
          if ([int]$analytics.total -lt 1) { throw "diagnostics analytics total was less than one: $($analytics | ConvertTo-Json -Compress)" }
          if ($health.diagnostics_enabled -ne $true) { throw "diagnostics were not enabled" }
        } finally {
          if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          Stop-Job -Job $mock -ErrorAction SilentlyContinue
          Remove-Job -Job $mock -Force -ErrorAction SilentlyContinue
        }

  release:
    name: Create Release
    needs: windows-smoke
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'

    - name: Download dependencies
      run: go mod download

    - name: Run tests
      run: go test -v ./...

    - name: Generate Windows icon resource
      run: go run github.com/akavel/rsrc@v0.10.2 -arch amd64 -ico assets/windows/claude-code-proxy.ico -o cmd/claude-code-proxy/rsrc_windows_amd64.syso

    - name: Build all platforms
      run: make VERSION=${{ github.ref_name }} build-all

    - name: Create checksums
      run: |
        cd dist
        sha256sum * > checksums.txt
        cat checksums.txt

    - name: Extract release notes
      id: extract-release-notes
      run: |
        VERSION=${GITHUB_REF#refs/tags/}
        echo "version=${VERSION}" >> $GITHUB_OUTPUT

        # Extract changelog section for this version
        if [ -f CHANGELOG.md ]; then
          # Get content between this version and next version heading
          CHANGELOG=$(sed -n "/## \[${VERSION#v}\]/,/## \[/p" CHANGELOG.md | sed '$d' | tail -n +2)

          if [ -n "$CHANGELOG" ]; then
            echo "Found changelog for ${VERSION}"
            # Save to file for body_path
            echo "$CHANGELOG" > /tmp/changelog_section.md
            echo "" >> /tmp/changelog_section.md
            echo "has_changelog=true" >> $GITHUB_OUTPUT
          else
            echo "No changelog section found for ${VERSION}"
            echo "has_changelog=false" >> $GITHUB_OUTPUT
          fi
        else
          echo "CHANGELOG.md not found"
          echo "has_changelog=false" >> $GITHUB_OUTPUT
        fi

        # Always create installation instructions
        cat >> /tmp/changelog_section.md << 'EOF'
        ## Installation

        Download the appropriate binary for your platform:

        ### macOS (Apple Silicon)
        ```bash
        wget https://github.com/${{ github.repository }}/releases/download/${VERSION}/claude-code-proxy-darwin-arm64
        chmod +x claude-code-proxy-darwin-arm64
        sudo mv claude-code-proxy-darwin-arm64 /usr/local/bin/claude-code-proxy
        ```

        ### macOS (Intel)
        ```bash
        wget https://github.com/${{ github.repository }}/releases/download/${VERSION}/claude-code-proxy-darwin-amd64
        chmod +x claude-code-proxy-darwin-amd64
        sudo mv claude-code-proxy-darwin-amd64 /usr/local/bin/claude-code-proxy
        ```

        ### Linux (x86_64)
        ```bash
        wget https://github.com/${{ github.repository }}/releases/download/${VERSION}/claude-code-proxy-linux-amd64
        chmod +x claude-code-proxy-linux-amd64
        sudo mv claude-code-proxy-linux-amd64 /usr/local/bin/claude-code-proxy
        ```

        ### Linux (ARM64)
        ```bash
        wget https://github.com/${{ github.repository }}/releases/download/${VERSION}/claude-code-proxy-linux-arm64
        chmod +x claude-code-proxy-linux-arm64
        sudo mv claude-code-proxy-linux-arm64 /usr/local/bin/claude-code-proxy
        ```

        ### Windows
        Download `claude-code-proxy-windows-amd64.exe` and add to your PATH.

        ## Verify Installation
        ```bash
        claude-code-proxy --help
        ```

        ## Quick Start
        See [README.md](https://github.com/${{ github.repository }}#quick-start) for configuration instructions.
        EOF

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          dist/claude-code-proxy-*
          dist/checksums.txt
        body_path: /tmp/changelog_section.md
        generate_release_notes: ${{ steps.extract-release-notes.outputs.has_changelog != 'true' }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
